{% extends 'base.html' %}
{% block title %}{{ user.username if user else 'New user' }}{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <a class="muted small" href="{{ url_for('admin.user_list') }}">← Users</a>
        <h1>{{ user.username if user else 'New user' }}</h1>
    </div>
</div>
<form method="post" class="card narrow" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if not user %}
    <label>Username
        <input name="username" value="{{ form.username }}" required autofocus>
    </label>
    {% endif %}
    <label>Role
        <select name="role">
            {% for r in roles %}<option value="{{ r }}" {{ 'selected' if form.role == r }}>{{ r }}</option>{% endfor %}
        </select>
    </label>
    {% if user %}
    <label class="check"><input type="checkbox" name="active" {{ 'checked' if form.active }}> Active (can log in)</label>
    {% endif %}
    <label>{{ 'New password' if user else 'Password' }}
        {% if user %}<span class="hint">leave empty to keep the current one</span>{% endif %}
        <input name="password" type="password" autocomplete="new-password" minlength="8" {{ 'required' if not user }}>
    </label>
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">{{ 'Save' if user else 'Create user' }}</button>
        <a class="btn btn-ghost" href="{{ url_for('admin.user_list') }}">Cancel</a>
    </div>
</form>
{% endblock %}
