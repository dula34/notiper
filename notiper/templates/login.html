{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block main_class %}auth-page{% endblock %}
{% block content %}
<form method="post" class="card auth-card">
    <div class="brand brand-lg"><span class="logo">N</span>Notiper</div>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
        <input name="username" autocomplete="username" required autofocus value="{{ request.form.username }}">
    </label>
    <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
</form>
{% endblock %}
